<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🏝️ 我現在又來"打"你了</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="viewport" id="viewportEl">
    <div class="stage-bg" id="stageBg">
      <div class="beam b1"></div>
      <div class="beam b2"></div>
      <div class="beam b3"></div>
      <div class="sun"></div>
      <div class="waves"></div>
    </div>

    <div id="stageRoot">
      <div class="wrap">
        <h1>🏝️ 我現在又來"打"你了</h1>

        <div class="hud">
          <div class="pill"><span class="label">分數</span><span id="scoreVal">0</span></div>
          <div class="pill time"><span class="label">時間</span><span id="timeVal">30</span></div>
          <div class="pill"><span class="label">速度</span><span id="speedVal">x1.0</span></div>
        </div>

        <div class="legend" id="legend"></div>

        <div class="board" id="board">
          <div class="footlights" id="footlights"></div>
        </div>

        <div class="controls">
          <button class="mainbtn" id="startBtn">開始登陸</button>
          <!-- <button class="ghost" id="settingsBtn">⚙️ Debug 設定</button> -->
        </div>
      </div>
    </div>
  </div>

  <div class="hammer" id="hammer">
    <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Hammer/3D/hammer_3d.png" alt=""
      onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
    <span class="emoji-fallback-hammer">🔨</span>
  </div>

  <button class="debug-toggle" id="debugToggleBtn" title="設定">⚙</button>

  <audio id="bgmAudio" src="assets/bgm.wav" loop preload="auto"></audio> <!-- 背景音樂檔案路徑設定  -->

  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <h2>完成登陸！</h2>
      <p>你的最終成績</p>
      <div class="finalScore" id="finalScore">0</div>
      <div class="hitStats" id="hitStats"></div>
      <button class="mainbtn" id="playAgainBtn">再登陸一次</button>
    </div>
  </div>

  <div class="overlay hidden" id="settingsOverlay">
    <div class="modal settings-modal">
      <h2>⚙️ Debug 設定</h2>

      <label>⏱️ 遊戲時間（秒）
        <input type="number" id="durationInput" min="5" max="600" step="1" placeholder="30">
      </label>
      <div class="btnrow">
        <button class="ghost" id="applyDurationBtn" style="width:100%;">套用時間</button>
      </div>

      <hr class="divider">

      <label class="toggle-row">🔊 音效<input type="checkbox" id="sfxToggle" checked></label>
      <label class="toggle-row">🎵 背景音樂<input type="checkbox" id="musicToggle" checked></label>

      <div class="btnrow">
        <button class="mainbtn" id="closeSettingsBtn" style="width:100%;">關閉</button>
      </div>     
    </div>
  </div>

  <div class="overlay hidden" id="rulesOverlay">
    <div class="modal rules-modal">
      <h2>🎯 遊戲規則</h2>
      <p class="hint">點擊畫面任意位置關閉</p>
      <div class="rules-section">
        <h3 class="good-title">✅ 加分項</h3>
        <div class="rules-row" id="rulesGood"></div>
      </div>
      <div class="rules-section">
        <h3 class="bad-title">❌ 扣分項</h3>
        <div class="rules-row" id="rulesBad"></div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
